# Udgiver kassen til Plejers webshop som Cloudflare Worker (plejer-butik). Kopieret fra StemplerInd.
# Kører, når kassen, kataloget eller testene ændres på main. Kan også startes med "Run workflow", også fra en anden gren.
# Kræver hemmeligheder i repoet: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID og STRIPE_SECRET_KEY.
# Valgfrit, så betalte ordrer lander i Shipmondo: STRIPE_WEBHOOK_SECRET, SHIPMONDO_API_USER og SHIPMONDO_API_KEY.
# Mangler de, springes udgivelsen over uden fejl. Se butik/LAES_MIG.md.
name: Kasse til webshoppen

on:
  push:
    branches: [main]
    paths:
      - 'butik/**'
      - 'tests/**'
      - 'kurv-data.js'
      - 'kurv.js'
      - '*.html'
      - 'package.json'
      - '.github/workflows/butik.yml'
  workflow_dispatch:

jobs:
  kasse:
    runs-on: ubuntu-latest
    env:
      HAR_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAR_STRIPE: ${{ secrets.STRIPE_SECRET_KEY != '' }}
      KASSE: https://plejer-butik.stemplerind.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installér
        run: npm ci

      - name: Test kassen og at hjemmesiden passer til kataloget
        run: npx vitest run

      - name: Lav kataloget til kurven og tjek, at det er committet
        run: node butik/konfigurer.mjs && git diff --exit-code

      - name: Udgiv kassen hos Cloudflare
        if: env.HAR_CLOUDFLARE == 'true'
        working-directory: butik
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Indsatte værdier kan have linjeskift eller mellemrum med. De fjernes, før Cloudflare får dem.
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CF_KONTO" | tr -d '\r\n ')
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          # Tjek tokenet først, så fejlen er til at forstå
          SVAR=$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$SVAR" | grep -q '"status":"active"' || { echo "::error::CLOUDFLARE_API_TOKEN virker ikke (Cloudflare svarer: $(echo "$SVAR" | grep -o '"message":"[^"]*"' | head -1)). Lav et nyt token med skabelonen Edit Cloudflare Workers, og læg det i GitHub igen."; exit 1; }
          echo "Cloudflare-tokenet er aktivt (${#CLOUDFLARE_API_TOKEN} tegn)."
          npx --yes wrangler@4 deploy

      - name: Læg nøglerne i Cloudflare
        if: env.HAR_CLOUDFLARE == 'true'
        working-directory: butik
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SHIPMONDO_API_USER: ${{ secrets.SHIPMONDO_API_USER }}
          SHIPMONDO_API_KEY: ${{ secrets.SHIPMONDO_API_KEY }}
        run: |
          # Kun dem, der findes i GitHub. Linjeskift fra indsatte værdier fjernes.
          for n in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SHIPMONDO_API_USER SHIPMONDO_API_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | tr -d '\r\n' | npx --yes wrangler@4 secret put "$n" >/dev/null && echo "$n lagt i Cloudflare"; else echo "::notice::$n mangler."; fi
          done

      - name: Prøv kassen
        if: env.HAR_CLOUDFLARE == 'true' && env.HAR_STRIPE == 'true'
        run: |
          # Som kunden i kurven: først den første GLS-pakkeshop ved 2300, så en rigtig betalingsside hos Stripe for én Pakke 1.
          # Fejler en af delene, bliver workflowet rødt.
          sleep 5
          curl -sS "$KASSE/"; echo
          SHOP=""
          if curl -sS "$KASSE/" | grep -q '"shipmondo":true'; then
            ID=$(curl -sS "$KASSE/pakkeshops?firma=gls&postnr=2300" -H 'origin: https://plejer.dk' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{let l=[];try{l=JSON.parse(d).pakkeshops||[]}catch(e){}process.stdout.write(l.length?l[0].id:"")})')
            [ -n "$ID" ] || { echo "::error::Kassen kunne ikke finde pakkeshops hos Shipmondo"; exit 1; }
            echo "Første GLS-pakkeshop ved 2300: $ID"
            SHOP=",\"pakkeshop\":{\"firma\":\"gls\",\"postnr\":\"2300\",\"id\":\"$ID\"}"
          else
            echo "::warning::Shipmondo er ikke sat op. Betalingen prøves uden pakkeshop."
          fi
          SVAR=$(curl -sS -X POST "$KASSE/kasse" -H 'origin: https://plejer.dk' -H 'content-type: application/json' -d "{\"varer\":[{\"id\":\"pakke-1\",\"antal\":1}],\"sprog\":\"da\",\"sti\":\"/\"$SHOP}")
          echo "$SVAR" | grep -q '"url":"https://checkout.stripe.com/' || { echo "::error::Kassen kunne ikke lave en betaling hos Stripe: $SVAR"; exit 1; }
          echo "Kassen laver betalingssider hos Stripe."

      - name: Mangler hemmeligheder
        if: env.HAR_CLOUDFLARE != 'true'
        run: echo "::notice::Kassen er ikke udgivet. Læg CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID og STRIPE_SECRET_KEY ind under Settings › Secrets and variables › Actions. Se butik/LAES_MIG.md."
