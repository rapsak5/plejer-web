# Bygger Plejer til Google Play (Trusted Web Activity via Bubblewrap).
# Kræver hemmelighederne PLEJER_KEYSTORE_B64 og PLEJER_KEYSTORE_PASSWORD.
# Hæv appVersionCode i android/twa-manifest.json før hver ny upload til Play.
name: Android

on:
  workflow_dispatch:

jobs:
  byg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Nøgle
        env:
          KEYSTORE_B64: ${{ secrets.PLEJER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Mangler hemmeligheden PLEJER_KEYSTORE_B64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
      - name: Generér Android-projekt
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Byg
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PLEJER_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PLEJER_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: plejer-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 14
